name: PHPUnit Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # Weekly check every Monday at 06:00 UTC

permissions:
  contents: read

jobs:
  symfony-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run local test runner script
        run: bash bin/test-run
